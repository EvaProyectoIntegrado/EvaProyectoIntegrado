{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes del Mes - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(180deg, #fff5f5 0%, #ffffff 100%);
            font-family: Arial, sans-serif;
        }
        .header {
            background: #c94b4b;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            margin-bottom: 30px;
        }
        .report-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .report-card h2 {
            font-size: 42px;
            color: #c94b4b;
            margin: 15px 0;
        }
        .btn-back {
            background: white;
            color: #c94b4b;
            border: 2px solid #c94b4b;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="bi bi-bar-chart-fill"></i> Reportes del Mes</h1>
        <p>{{ mes_nombre }}</p>
    </div>

    <div class="container">
        <div class="mb-3">
            <a href="/dashboard/" class="btn-back">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="report-card">
                    <i class="bi bi-people" style="font-size: 40px; color: #10b981;"></i>
                    <h2>{{ madres_mes }}</h2>
                    <p>Madres Atendidas</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="report-card">
                    <i class="bi bi-heart-pulse" style="font-size: 40px; color: #8b5cf6;"></i>
                    <h2>{{ partos_mes }}</h2>
                    <p>Partos Realizados</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="report-card">
                    <i class="bi bi-baby" style="font-size: 40px; color: #f59e0b;"></i>
                    <h2>{{ rn_mes }}</h2>
                    <p>Recién Nacidos</p>
                </div>
            </div>
        </div>

        <div class="mt-5 p-4 bg-white rounded shadow">
            <h4><i class="bi bi-graph-up"></i> Resumen del Período</h4>
            <p class="lead">Total de registros este mes: <strong>{{ total_reportes }}</strong></p>
            <a href="/descargar-rem22/" class="btn btn-danger mt-3">
                <i class="bi bi-file-pdf"></i> Descargar Informe PDF
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
