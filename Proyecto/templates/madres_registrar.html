{% extends "base.html" %}
{% load static %}

{% block title %}Registrar Madre{% endblock %}

{% block content %}

<div class="form-card">
    <h1>🤰 Registrar Madre</h1>

    <form method="POST">
        {% csrf_token %}

        <label>RUT:</label>
        <input type="text" name="rut" required>

        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <label>Edad:</label>
        <input type="number" name="edad" required>

        <label>Dirección:</label>
        <input type="text" name="direccion" required>

        <button type="submit" class="btn-submit">Registrar Madre</button>
    </form>
</div>

<style>
.form-card {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
    text-align: center;
}

form label {
    margin-top: 15px;
    display: block;
    text-align: left;
    font-weight: bold;
}

form input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.btn-submit {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #ffb3d9;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.btn-submit:hover {
    background: #ff99cc;
}
</style>

{% endblock %}
