{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Registro de Partos</h2>

<div class="card">
    <h3>➕ Registrar Parto</h3>

    <form id="formCrearParto" class="form-grid">

        <div class="form-group">
            <label>ID de la Madre:</label>
            <input type="number" id="madre" required>
        </div>

        <div class="form-group">
            <label>Fecha del Parto:</label>
            <input type="date" id="fecha_parto" required>
        </div>

        <div class="form-group">
            <label>Tipo de Parto:</label>
            <select id="tipo_parto" required>
                <option value="Normal">Normal</option>
                <option value="Cesárea">Cesárea</option>
                <option value="Inducido">Inducido</option>
            </select>
        </div>

        <div class="form-group full">
            <label>Observaciones:</label>
            <textarea id="observaciones" rows="3" placeholder="Notas clínicas..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Registrar Parto</button>
    </form>
</div>

<hr>

<div class="card">
    <h3>📋 Listado de Partos</h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Madre</th>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Observaciones</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tablaPartos"></tbody>
    </table>
</div>

<style>
.full { grid-column: span 2; }
</style>

<script>
function cargarPartos(){
    fetch("/api/partos/")
        .then(r => r.json())
        .then(data => {
            let html = "";
            data.forEach(p => {
                html += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.madre_nombre}</td>
                    <td>${p.fecha_parto}</td>
                    <td>${p.tipo_parto}</td>
                    <td>${p.observaciones || "-"}</td>
                    <td><button onclick="eliminarParto(${p.id})" class="btn btn-danger">Eliminar</button></td>
                </tr>`;
            });
            document.getElementById("tablaPartos").innerHTML = html;
        });
}

document.getElementById("formCrearParto").addEventListener("submit", function(e){
    e.preventDefault();

    fetch("/api/parto/crear/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            madre: document.getElementById("madre").value,
            fecha_parto: document.getElementById("fecha_parto").value,
            tipo_parto: document.getElementById("tipo_parto").value,
            observaciones: document.getElementById("observaciones").value
        })
    }).then(() => {
        cargarPartos();
        e.target.reset();
    });
});

function eliminarParto(id){
    fetch(`/api/parto/${id}/eliminar/`, {method:"DELETE"})
        .then(() => cargarPartos());
}

cargarPartos();
</script>

{% endblock %}
