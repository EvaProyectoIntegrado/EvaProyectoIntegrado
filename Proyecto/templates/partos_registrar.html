{% extends "base.html" %}
{% load static %}

{% block title %}Registrar Parto{% endblock %}

{% block content %}

<style>
    .form-card {
        max-width: 600px;
        margin: 30px auto;
        padding: 35px 40px;
        background: white;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .form-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .form-header h2 {
        font-size: 32px;
        color: #444;
        margin-bottom: 8px;
    }

    .form-header h3 {
        font-size: 18px;
        color: #d46a8b;
        font-weight: normal;
        margin: 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        color: #444;
        margin-bottom: 8px;
        font-size: 15px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px 18px;
        font-size: 15px;
        font-family: "Poppins", sans-serif;
        border: 2px solid #ffbfd0;
        border-radius: 12px;
        transition: all 0.3s ease;
        background-color: #fff;
        color: #333;
        box-sizing: border-box;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #ff4f87;
        box-shadow: 0 0 0 3px rgba(255, 79, 135, 0.1);
    }

    .form-group input:hover,
    .form-group select:hover,
    .form-group textarea:hover {
        border-color: #ffa8c5;
    }

    .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 30px;
        justify-content: center;
    }

    .btn-submit {
        padding: 12px 35px;
        font-size: 16px;
        font-weight: bold;
        font-family: "Poppins", sans-serif;
        color: white;
        background: linear-gradient(135deg, #ff4f87 0%, #d46a8b 100%);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(255, 79, 135, 0.3);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(255, 79, 135, 0.4);
    }

    .btn-submit:active {
        transform: translateY(0);
    }

    .btn-cancel {
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        font-family: "Poppins", sans-serif;
        color: #444;
        background: #f0f0f0;
        border: 2px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-cancel:hover {
        background: #e0e0e0;
        border-color: #ccc;
    }

    /* Dark Mode */
    .dark-mode .form-card {
        background: #2c2836;
    }

    .dark-mode .form-header h2 {
        color: #fff;
    }

    .dark-mode .form-header h3 {
        color: #ff9aa8;
    }

    .dark-mode .form-group label {
        color: #fff;
    }

    .dark-mode .form-group input,
    .dark-mode .form-group select,
    .dark-mode .form-group textarea {
        background: #3a3447;
        border-color: #4a4058;
        color: #eee;
    }

    .dark-mode .form-group input:focus,
    .dark-mode .form-group select:focus,
    .dark-mode .form-group textarea:focus {
        border-color: #ff4f87;
        background: #423952;
    }

    .dark-mode .btn-cancel {
        background: #3a3447;
        color: #eee;
        border-color: #4a4058;
    }

    .dark-mode .btn-cancel:hover {
        background: #423952;
        border-color: #5a5068;
    }

    @media (max-width: 768px) {
        .form-card {
            padding: 30px 25px;
            margin: 20px;
        }

        .form-header h2 {
            font-size: 28px;
        }

        .form-header h3 {
            font-size: 18px;
        }

        .btn-group {
            flex-direction: column;
        }

        .btn-submit,
        .btn-cancel {
            width: 100%;
        }
    }
</style>

<div class="form-card">
    <div class="form-header">
        <h2>🩺 Registrar Parto</h2>
        <h3>Ingresa los datos del nuevo parto</h3>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="madre">👤 Madre</label>
            <select id="madre" name="madre" required>
                <option value="">Seleccione una madre</option>
                {% for m in madres %}
                <option value="{{ m.id }}">{{ m.nombre }} ({{ m.rut }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="fecha_parto">📅 Fecha del Parto</label>
            <input type="date" id="fecha_parto" name="fecha_parto" required>
        </div>

        <div class="form-group">
            <label for="tipo_parto">🏥 Tipo de Parto</label>
            <select id="tipo_parto" name="tipo_parto" required>
                <option value="">Seleccione tipo</option>
                <option value="Normal">Normal</option>
                <option value="Cesárea">Cesárea</option>
                <option value="Inducido">Inducido</option>
            </select>
        </div>

        <div class="form-group">
            <label for="observaciones">📝 Observaciones</label>
            <textarea id="observaciones" name="observaciones" placeholder="Notas del parto..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-submit" type="submit">Registrar Parto</button>
            <a href="{% url 'partos' %}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
