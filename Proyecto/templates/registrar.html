<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Sistema Perinatal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
        }

        .register-card {
            background: white;
            border-radius: 25px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .register-header h1 {
            font-size: 26px;
            color: #2d3748;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .register-header p {
            color: #718096;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #a0aec0;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background-color: #f7fafc;
        }

        .form-group select {
            padding-left: 48px;
            cursor: pointer;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #cbd5e0;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #718096;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #c53030;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #22543d;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: white;
            font-size: 13px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-register.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-register.loading .spinner {
            display: inline-block;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 35px 28px;
            }

            .register-header h1 {
                font-size: 22px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 32px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-container {
            animation: fadeInUp 0.6s ease;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo">🍼</div>
                <h1>Crear Cuenta Nueva</h1>
                <p>Completa el formulario para registrarte</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            id="nombre" 
                            placeholder="Tu nombre completo"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="correo@ejemplo.com"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Mínimo 6 caracteres"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="rol">Rol en el sistema</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👥</span>
                        <select id="rol" required>
                            <option value="">Seleccione un rol</option>
                            <option value="matrona">👩‍⚕️ Matrona</option>
                            <option value="medico">👨‍⚕️ Médico</option>
                            <option value="jefe_area">🧑‍💼 Jefe de Área</option>
                            <option value="admin">🛠️ Administrador</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-register">
                    Crear Cuenta
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="/login/">Iniciar sesión</a>
            </div>
        </div>

        <div class="footer-text">
            © 2025 Sistema de Gestión Perinatal
        </div>
    </div>

    <script>
        console.log("Registro JS cargado correctamente");

        const form = document.getElementById("registerForm");
        const alertBox = document.getElementById("alert");
        const submitBtn = form.querySelector(".btn-register");

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const rol = document.getElementById("rol").value;

            // Validaciones
            if (!nombre || !email || !password || !rol) {
                showAlert("Por favor completa todos los campos", "error");
                return;
            }

            if (password.length < 6) {
                showAlert("La contraseña debe tener al menos 6 caracteres", "error");
                return;
            }

            // Activar estado de carga
            submitBtn.classList.add("loading");
            submitBtn.innerHTML = 'Creando cuenta... <span class="spinner"></span>';

            try {
                const response = await fetch("/api/registrar/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        email: email,
                        contraseña: password,
                        rol: rol
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert("¡Cuenta creada exitosamente! Redirigiendo al login...", "success");
                    
                    setTimeout(() => {
                        window.location.href = "/login/";
                    }, 2000);
                } else {
                    showAlert(data.msg || "Error al crear la cuenta", "error");
                    submitBtn.classList.remove("loading");
                    submitBtn.innerHTML = 'Crear Cuenta';
                }
            } catch (error) {
                console.error("Error:", error);
                showAlert("Error de conexión. Inténtalo de nuevo.", "error");
                submitBtn.classList.remove("loading");
                submitBtn.innerHTML = 'Crear Cuenta';
            }
        });
    </script>
</body>
</html>
