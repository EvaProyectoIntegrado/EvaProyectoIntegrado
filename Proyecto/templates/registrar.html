{% extends "base.html" %}
{% load static %}

{% block title %} 🍼 Crear Cuenta {% endblock %}

{% block content %}

<div class="form-card">
    <h2 class="form-title"><span class="emoji">🍼</span> Crear Cuenta</h2>

    <form id="registerForm">

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label>Correo</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="*******">
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select id="rol">
                <option value="">Seleccione un rol</option>
                <option value="matrona">👩‍⚕Matrona</option>
                <option value="medico">👨‍⚕Médico</option>
                <option value="jefe_area">🧑‍💼Jefe de Área</option>
                <option value="admin">🛠Administrador</option>
            </select>
        </div>

        <button type="button" id="btnRegister" class="btn-primary">
            Crear Cuenta
        </button>
    </form>

    <p class="footer-text">
        ¿Ya tienes cuenta?
        <a href="/login/">Iniciar sesión</a>
    </p>
</div>

<script src="{% static 'js/register.js' %}"></script>

{% endblock %}
